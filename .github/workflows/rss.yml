name: Generate RSS feed

on:
  schedule:
    # Deliberately off the hour boundary: GitHub delays or silently drops
    # scheduled runs during high-load periods, and :00 is the busiest minute.
    - cron: "23 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feeds
        run: python generate_feed.py

      - name: Commit and push feeds if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Glob rather than a fixed list so adding a source to SOURCES needs
          # no workflow change for its feed to be committed.
          git add ./*_feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update feeds [skip ci]"
            git push
          else
            echo "No changes to the feeds"
          fi
