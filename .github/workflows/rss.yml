name: Generate RSS feed

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        run: python generate_feed.py

      - name: Commit and push sportnet_feed.xml if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sportnet_feed.xml
          if ! git diff --cached --quiet -- sportnet_feed.xml; then
            git commit -m "Update sportnet_feed.xml [skip ci]"
            git push
          else
            echo "No changes to sportnet_feed.xml"
          fi
