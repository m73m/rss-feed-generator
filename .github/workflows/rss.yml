name: Generate RSS feed

on:
  schedule:
    # Frequently-updated sources, every 2 hours. Deliberately off the hour
    # boundary: GitHub delays or silently drops scheduled runs during
    # high-load periods, and :00 is the busiest minute.
    - cron: "23 */2 * * *"
    # Slower-moving sources, every 4 hours. The hours are chosen to keep the
    # original 06:23 and 18:23 UTC slots — 07:23 and 19:23 CET — and space
    # the rest evenly around them. Cron is UTC-only and cannot follow DST,
    # so while Central Europe is on CEST these land an hour later locally.
    - cron: "23 2,6,10,14,18,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# The two schedules overlap on every hour the slower one fires, and GitHub
# starts a separate run per matching cron entry. Without this, those two
# runs would race to push and one would be rejected as non-fast-forward;
# queueing them means the second checks out the first's commit.
concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select sources for this trigger
        id: select
        run: |
          case "${{ github.event.schedule }}" in
            "23 2,6,10,14,18,22 * * *") args="--only nike fsb" ;;
            "23 */2 * * *")  args="--exclude nike fsb" ;;
            *)               args="" ;;  # manual dispatch: every source
          esac
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Running with: ${args:-<all sources>}"

      - name: Generate feeds
        run: python generate_feed.py ${{ steps.select.outputs.args }}

      - name: Commit and push feeds if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Glob rather than a fixed list so adding a source to SOURCES needs
          # no workflow change for its feed to be committed.
          git add ./*_feed.xml
          if git diff --cached --quiet; then
            echo "No changes to the feeds"
            exit 0
          fi
          git commit -m "Update feeds [skip ci]"
          # Belt and braces behind the concurrency group: if main moved
          # anyway, replay this commit on top rather than failing the run.
          git push || { git pull --rebase && git push; }
